# ============================================================
# Proxy Groups
#
# 显示顺序：
#
# ① 自选组
# ② 系统组
#
# 用户主要调整自选组。
# 系统组负责底层节点自动整理。
# ============================================================

proxy-groups:


  # ==========================================================
  # ① 用户自选组
  # ==========================================================

  # ----------------------------------------------------------
  # 默认代理
  #
  # 所有没有命中特定分流规则的网站 / APP
  # 最终会进入这里。
  #
  # 这是用户可以主动调整的，因此属于【自选】。
  # ----------------------------------------------------------

  - name: "🚀 默认代理【自选】"
    type: select
    proxies:
      - "♻️ 自动选择 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌐 全部节点 [系统]"


  - name: "🤖 AI服务【自选】"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "📺 油管专用【自选】"
    type: select
    proxies:
      - "🇭🇰 香港节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "🎬 流媒体【自选】"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "💬 电报专用【自选】"
    type: select
    proxies:
      - "🇭🇰 香港节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "Ⓜ️ 微软服务【自选】"
    type: select
    proxies:
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "🍎 苹果服务【自选】"
    type: select
    proxies:
      - "🇭🇰 香港节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "🔍 谷歌服务【自选】"
    type: select
    proxies:
      - "🇺🇸 美国节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "💰 币圈专用【自选】"
    type: select
    proxies:
      - "🇭🇰 香港节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  - name: "🖥️ 软件分流【自选】"
    type: select
    proxies:
      - "🚀 默认代理【自选】"
      - "♻️ 自动选择 [系统]"
      - "🇭🇰 香港节点 [系统]"
      - "🇯🇵 日本节点 [系统]"
      - "🇸🇬 新加坡节点 [系统]"
      - "🇺🇸 美国节点 [系统]"
      - "🇹🇼 台湾节点 [系统]"
      - "🌐 全部节点 [系统]"
      - DIRECT


  # ==========================================================
  # ② 系统组
  # ==========================================================

  # ----------------------------------------------------------
  # 全部节点
  #
  # 包含机场订阅中的所有代理节点。
  # 官网、流量、到期等信息节点也会保留。
  # ----------------------------------------------------------

  - name: "🌐 全部节点 [系统]"
    type: select
    include-all-proxies: true
    exclude-type: "Direct"


  # ----------------------------------------------------------
  # 自动选择
  #
  # 自动从所有代理节点中选择延迟较低的节点。
  #
  # 排除：
  # 官网 / 流量 / 到期 / 套餐 / 订阅等信息节点
  # ----------------------------------------------------------

  - name: "♻️ 自动选择 [系统]"
    type: url-test
    include-all-proxies: true
    exclude-type: "Direct"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  # ==========================================================
  # 地区节点
  # ==========================================================

  - name: "🇭🇰 香港节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)香港|hk|hong[ -]?kong"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  - name: "🇯🇵 日本节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)日本|jp|japan"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  - name: "🇸🇬 新加坡节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)新加坡|sg|singapore"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  - name: "🇺🇸 美国节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)美国|us|usa|united[ -]?states|america"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  - name: "🇹🇼 台湾节点 [系统]"
    type: url-test
    include-all-proxies: true
    filter: "(?i)台湾|tw|taiwan"
    exclude-filter: "(?i)官网|流量|剩余|到期|过期|套餐|订阅|重置|traffic|expire|expired|subscription|reset|official|website"
    exclude-type: "Direct"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  # ----------------------------------------------------------
  # 广告拦截
  # ----------------------------------------------------------

  - name: "🛑 广告拦截 [系统]"
    type: select
    proxies:
      - REJECT
      - DIRECT


# ============================================================
# Rules
# ============================================================

rules:

  # ==========================================================
  # 软件进程分流
  #
  # 必须放在前面。
  #
  # software.yaml 中的 PROCESS-NAME-WILDCARD
  # 会优先于下面的域名规则。
  # ==========================================================

  - "RULE-SET,software,🖥️ 软件分流【自选】"


  # ==========================================================
  # 私有地址 / 局域网
  # ==========================================================

  - "GEOSITE,private,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"


  # ==========================================================
  # 广告
  # ==========================================================

  - "RULE-SET,ads,🛑 广告拦截 [系统]"


  # ==========================================================
  # AI
  # ==========================================================

  - "RULE-SET,ai,🤖 AI服务【自选】"


  # ==========================================================
  # YouTube
  # ==========================================================

  - "RULE-SET,youtube,📺 油管专用【自选】"


  # ==========================================================
  # Cryptocurrency
  # ==========================================================

  - "RULE-SET,crypto,💰 币圈专用【自选】"


  # ==========================================================
  # Disney / Netflix
  # ==========================================================

  - "RULE-SET,disney,🎬 流媒体【自选】"
  - "GEOSITE,netflix,🎬 流媒体【自选】"


  # ==========================================================
  # Apple
  # ==========================================================

  - "RULE-SET,apple,🍎 苹果服务【自选】"


  # ==========================================================
  # Google
  # ==========================================================

  - "RULE-SET,google,🔍 谷歌服务【自选】"


  # ==========================================================
  # Telegram
  # ==========================================================

  - "GEOSITE,telegram,💬 电报专用【自选】"


  # ==========================================================
  # Microsoft
  # ==========================================================

  - "GEOSITE,microsoft,Ⓜ️ 微软服务【自选】"


  # ==========================================================
  # 中国大陆
  # ==========================================================

  - "GEOSITE,CN,DIRECT"
  - "GEOIP,CN,DIRECT,no-resolve"


  # ==========================================================
  # 最终兜底
  # ==========================================================

  - "MATCH,🚀 默认代理【自选】"
