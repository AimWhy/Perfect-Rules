# ============================================================
# 阿尔忒弥斯实验室 · Clash 完美分流 3.0
#
# 使用方式：
# Clash Verge
# → 订阅
# → 全局扩展覆写配置
# → 删除原内容
# → 将本文件全部粘贴进去
#
# 本文件只需要用户手动配置一次。
# 后续规则库通过 Rule Provider 自动更新。
# ============================================================


# ============================================================
